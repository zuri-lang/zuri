[book]
title = "The Zuri Programming Language"
authors = ["The Zuri Project"]
description = "An introduction to Zuri, from your first line of code to a full-stack web application."
language = "en"
src = "src"

# Rendered output goes in target/, not beside the source. It is a build
# artifact, it is already git-ignored there, and build.rs watches this
# directory for changes; writing into it would make every build trigger
# the next one.
[build]
build-dir = "../../target/book"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/zuri-lang/zuri-rs"
edit-url-template = "https://github.com/zuri-lang/zuri-rs/edit/main/docs/book/src/{path}"
mathjax-support = false

# mdBook's highlight.js has no Zuri in it. This registers the language
# and re-highlights the blocks its first pass skipped, so the one file
# serves both books.
additional-js = ["theme/zuri-highlight.js"]

[output.html.fold]
enable = true
level = 1
