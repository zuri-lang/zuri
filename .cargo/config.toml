# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# musl builds link the C library dynamically, as Alpine's own programs do.
# A statically linked musl program cannot load a shared library, so `ffi`
# would have nothing to open. build.rs links libgcc's unwinder in
# statically, so the build needs only musl where it runs.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

# Documentation. See docs/README.md, or `cargo docs help`.
#
# Each builds `zuri` and runs docs/tools/site.zu with it, from the
# repository root, and both books are built by `zuri doc`. `--quiet`
# keeps cargo's own compile chatter out of the way; the tool prints what
# it is doing itself.
[alias]
build-docs = ["run", "--quiet", "--bin", "zuri", "--", "run", "docs/tools/site.zu", "build"]
run-docs = ["run", "--quiet", "--bin", "zuri", "--", "run", "docs/tools/site.zu", "serve"]
clean-docs = ["run", "--quiet", "--bin", "zuri", "--", "run", "docs/tools/site.zu", "clean"]

# The same tool with nothing assumed, for `cargo docs help` and for
# passing a subcommand of your own choosing.
docs = ["run", "--quiet", "--bin", "zuri", "--", "run", "docs/tools/site.zu"]

# Puts libs/ and cmds/ beside an already-built binary, so a change to a
# `.zu` file takes effect without a rebuild. See `cargo sync help`.
sync = ["run", "--quiet", "--package", "xtask", "--", "sync"]
xtask = ["run", "--quiet", "--package", "xtask", "--"]

# Builds vendor/crates from vendor/patches, which the workspace needs
# before its first build. The tool is its own workspace, since this one
# cannot load until the copies exist. See vendor/README.md.
patch-crates = [
  "run", "--quiet", "--manifest-path", "vendor/tool/Cargo.toml",
  "--target-dir", "target/patch-crates", "--",
]
