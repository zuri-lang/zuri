name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        type: string
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # The patched crates are built from vendor/patches rather than
      # committed, and the workspace does not load without them.
      - name: Patch crates
        run: cargo patch-crates

      # Cargo.toml and Cargo.lock carry the repository default (0.1.0); the
      # release binary needs its embedded version to match the release tag.
      - name: Set release version
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          python="${{ runner.os == 'Windows' && 'python' || 'python3' }}"

          "$python" - "$version" <<'PY'
          import sys
          import re

          version = sys.argv[1]

          with open("Cargo.toml", "r", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(
              r'^(version\s*=\s*)"[^"]+"',
              f'\\g<1>"{version}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )
          content = re.sub(
              r'(\[package\.metadata\.zuri\][^\[]*?version\s*=\s*)"[^"]+"',
              f'\\g<1>"{version}"',
              content,
              count=1,
          )
          content = re.sub(
              r'(\[package\.metadata\.zuri\][^\[]*?vm_version\s*=\s*)"[^"]+"',
              f'\\g<1>"{version}"',
              content,
              count=1,
          )

          with open("Cargo.toml", "w", encoding="utf-8") as f:
              f.write(content)

          try:
              with open("Cargo.lock", "r", encoding="utf-8") as f:
                  lock = f.read()
              lock = re.sub(
                  r'(\[\[package\]\]\s+name\s*=\s*"zuri"\s+version\s*=\s*)"[^"]+"',
                  f'\\g<1>"{version}"',
                  lock,
                  count=1,
              )
              with open("Cargo.lock", "w", encoding="utf-8") as f:
                  f.write(lock)
          except FileNotFoundError:
              pass
          PY

      # The production profile is the release build without debug info,
      # which would otherwise make up most of what a user downloads.
      - name: Build
        run: cargo build --locked --profile production --target ${{ matrix.target }}

      # The binary alone is not a working install: at startup it looks
      # for `libs` beside itself (or at $ZURI_ROOT), and without it no
      # `import` resolves; `cmds` holds the commands it ships, such as
      # `zuri test`. `build.rs` has already put copies of both next to
      # the binary, and those copies are what ship.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.tag }}"
            version="${version#v}"
          fi

          name="zuri-${version}-${{ matrix.target }}"
          out="target/${{ matrix.target }}/production"
          staged="dist/${name}"

          mkdir -p "${staged}"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "${out}/zuri.exe" "${staged}/"
          else
            cp "${out}/zuri" "${staged}/"
          fi

          cp -r "${out}/libs" "${staged}/libs"
          cp -r "${out}/cmds" "${staged}/cmds"
          cp LICENSE README.md "${staged}/"

          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "${name}.zip" "${name}" > /dev/null
          else
            tar czf "${name}.tar.gz" "${name}"
          fi

          echo "ASSET=dist/${name}.${{ matrix.archive }}" >> "$GITHUB_ENV"

      # A checksum beside each archive, so a download can be verified
      # without trusting the transfer.
      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          file="$(basename "${ASSET}")"
          if command -v sha256sum > /dev/null; then
            sha256sum "${file}" > "${file}.sha256"
          else
            shasum -a 256 "${file}" > "${file}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # Both installers, on every platform, against the archives just built,
  # served from the runner in the shape GitHub lists releases in. The
  # release goes out only once each one has installed a runtime that
  # runs, so the one-line install on the website is never the broken
  # part of a release.
  installers:
    name: install on ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist

      - name: List the release
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          python="${{ runner.os == 'Windows' && 'python' || 'python3' }}"

          "$python" - "$version" "${{ matrix.target }}" > dist/releases.json <<'PY'
          import json
          import sys

          version, target = sys.argv[1:]
          name = f"zuri-{version}-{target}." + ("zip" if "windows" in target else "tar.gz")
          base = "http://127.0.0.1:8765/"
          assets = [{"name": n, "browser_download_url": base + n} for n in (name, name + ".sha256")]

          print(json.dumps([{"tag_name": "v" + version, "draft": False, "prerelease": False, "assets": assets}]))
          PY

          echo "ZURI_VERSION_UNDER_TEST=${version}" >> "$GITHUB_ENV"

      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          version="${ZURI_VERSION_UNDER_TEST}"
          home="${RUNNER_TEMP}/home"
          mkdir -p "${home}"

          (cd dist && exec python3 -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1) &
          server=$!
          trap 'kill ${server} 2> /dev/null || true' EXIT

          for _ in $(seq 1 50); do
            curl -fs -o /dev/null http://127.0.0.1:8765/releases.json && break
            sleep 0.2
          done

          export ZURI_RELEASES_URL=http://127.0.0.1:8765/releases.json

          HOME="${home}" SHELL=/bin/bash sh install.sh --version "${version}"

          # Again, piped the way the website gives it, over the top of
          # the first.
          newest=''
          case "${version}" in *-*) newest='--prerelease' ;; esac
          cat install.sh | HOME="${home}" SHELL=/bin/bash sh -s -- ${newest}

          "${home}/.zuri/bin/zuri" --version | grep -F "Zuri ${version}"

          echo "echo 'installed'" > "${RUNNER_TEMP}/check.zu"
          test "$("${home}/.zuri/bin/zuri" run "${RUNNER_TEMP}/check.zu")" = installed

          profile="${home}/.bashrc"
          if [ "$(uname -s)" = Darwin ]; then
            profile="${home}/.bash_profile"
          fi
          test "$(grep -c '.zuri/bin' "${profile}")" = 1

      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $expectedVersion = ($env:ZURI_VERSION_UNDER_TEST).Trim()
          $env:ZURI_HOME = Join-Path $env:RUNNER_TEMP 'zuri-home'
          $env:ZURI_RELEASES_URL = 'http://127.0.0.1:8765/releases.json'

          $server = Start-Process python -PassThru -WindowStyle Hidden `
            -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', 'dist'

          try {
            for ($i = 0; $i -lt 50; $i++) {
              try {
                Invoke-WebRequest -Uri $env:ZURI_RELEASES_URL -UseBasicParsing | Out-Null
                break
              } catch {
                Start-Sleep -Milliseconds 200
              }
            }

            # Windows PowerShell first, which is what most machines have.
            powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Version $expectedVersion

            if ($LASTEXITCODE -ne 0) {
              throw 'install.ps1 failed under Windows PowerShell'
            }

            # Then pasted into this session, the way the website gives it,
            # over the top of the first.
            $script = Get-Content -Raw install.ps1

            if ($expectedVersion.Contains('-')) {
              & ([scriptblock]::Create($script)) -Prerelease
            } else {
              Invoke-Expression $script
            }

            $reported = (& zuri --version | Out-String)

            if (-not $reported.Contains("Zuri $expectedVersion")) {
              throw "the installed zuri says '$reported'"
            }

            Set-Content -Path (Join-Path $env:RUNNER_TEMP 'check.zu') -Value "echo 'installed'"

            if ((& zuri run (Join-Path $env:RUNNER_TEMP 'check.zu')) -ne 'installed') {
              throw 'the installed zuri did not run a script'
            }

            $path = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
            $runtime = Join-Path $env:ZURI_HOME 'runtime'

            if (-not (($path -split ';') -contains $runtime)) {
              throw "$runtime is not on the user's PATH"
            }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }

  release:
    name: publish
    needs: [build, installers]
    runs-on: ubuntu-latest

    steps:
      # The full history, because the notes are the commits since the
      # tag before this one.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the release notes
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ github.event.inputs.tag || github.ref_name }}"
          previous="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"

          {
            if [ -n "${previous}" ]; then
              echo "## Changes since ${previous}"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${previous}..${tag}"
              echo
            else
              echo "## Changes"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${tag}"
              echo
            fi

            echo
            echo "## Installing"
            echo
            echo "Unpack the archive for your platform and put \`zuri\` on your"
            echo "\`PATH\`. Keep the \`libs\` and \`cmds\` directories beside it:"
            echo "they are the standard library and the commands the runtime"
            echo "ships, and it looks for both there."
            echo
            echo "Verify a download against its \`.sha256\` before running it."
          } > NOTES.release.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Zuri ${{ github.event.inputs.tag || github.ref_name }}
          body_path: NOTES.release.md
          # GitHub's own "what changed" list is appended under the notes
          # written above, so contributors and pull requests are credited
          # without hand-maintaining a changelog.
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true

  # Whatever went out needs documentation that matches it, so the site
  # is republished from the released code. It runs only once the release
  # itself is up, so a failed build never republishes the site.
  documentation:
    name: documentation
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
