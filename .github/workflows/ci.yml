name: CI

on:
  push:
    branches: [main, jit, dev]
  pull_request:
  workflow_dispatch:

# Cancel a run that a newer push has already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build
        run: cargo build --locked

      # The conformance suite. `build.rs` copies `libs/` next to the
      # binary, so the standard library is found without any env set.
      #
      # No backtrace on purpose. A fixture that fails does so because
      # the Zuri program inside it raised, and the panic already
      # carries that program's error, its source line and its own stack
      # trace. A Rust backtrace on top of that is three dozen frames of
      # the test harness calling itself, and with a few fixtures
      # failing at once it buries the list of which ones failed under
      # more output than a run log will hold.
      #
      # Set through `env:` rather than as a `VAR=value` prefix on the
      # command: Windows runners use PowerShell, which reads that
      # prefix as the name of a command to run and fails before cargo
      # is ever reached. `env:` is applied by the runner itself, so it
      # works the same on all three.
      - name: Test
        env:
          RUST_BACKTRACE: full
        run: cargo test --locked --test zuri

      # A fixture killed by a signal produces no Rust backtrace and no
      # Zuri stack trace, so an exit status is the whole of what a
      # failing run says about it. macOS writes a real report for the
      # process that died, naming the faulting thread and its stack;
      # that report lives on a runner that is destroyed the moment this
      # job ends, so it has to be read out here or not at all.
      - name: Crash reports
        if: failure() && runner.os == 'macOS'
        run: |
          shopt -s nullglob
          reports=(~/Library/Logs/DiagnosticReports/*.ips)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "no crash reports were written"
            exit 0
          fi
          for report in "${reports[@]}"; do
            echo "===== $report"
            cat "$report"
          done

  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all --check

  documentation:
    name: documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: docs

      # The reference's pages are generated rather than committed, so
      # they have to exist before anything can be checked against them.
      # This needs no mdBook: it writes markdown and stops.
      - name: Build and generate the reference
        run: |
          cargo build --locked
          cargo docs generate

      # A defect in a doc block in `libs/` becomes a defect in both
      # books, so the blocks are checked at their source.
      - name: Audit the library's doc blocks
        run: ./target/debug/zuri docs/tools/audit.zu
        env:
          ZURI_ROOT: ${{ github.workspace }}

      - name: Check every link and anchor
        run: ./target/debug/zuri docs/tools/links.zu
        env:
          ZURI_ROOT: ${{ github.workspace }}

  examples:
    name: examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: docs

      - name: Build and generate the reference
        run: |
          cargo build --locked
          cargo docs generate

      # Every runnable example in both books is run and its output
      # compared against what the page claims it prints. This is the
      # slow one, which is why it is its own job.
      - name: Run every example
        run: ./target/debug/zuri docs/tools/verify.zu
        env:
          ZURI_ROOT: ${{ github.workspace }}
