name: CI

on:
  push:
    branches: [main, jit, dev]
  pull_request:
  workflow_dispatch:

# Cancel a run that a newer push has already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # The patched crates are built from vendor/patches rather than
      # committed, and the workspace does not load without them.
      - name: Patch crates
        run: cargo patch-crates

      - name: Build
        run: cargo build --locked

      # The conformance suite. `build.rs` copies `libs/` next to the
      # binary, so the standard library is found without any env set.
      #
      # The backtrace is set through `env:` rather than as a
      # `VAR=value` prefix on the command: Windows runners use
      # PowerShell, which reads that prefix as the name of a command to
      # run and fails before cargo is ever reached. `env:` is applied
      # by the runner itself, so it works the same on all three.
      # Run through bash on every runner, Windows included, so the
      # pipeline below behaves the same way everywhere: PowerShell's
      # own pipeline would report tee's exit status rather than
      # cargo's, and a failing suite would read as a passing step.
      - name: Test
        shell: bash
        env:
          RUST_BACKTRACE: full
        run: |
          set -o pipefail
          cargo test --locked --test zuri 2>&1 | tee test-output.txt

      # The same suite with Kebbi alone, the mode `ZURI_JIT_BAYELSA=0`
      # selects. The default run above covers both compilers together.
      - name: Test with Kebbi alone
        shell: bash
        env:
          RUST_BACKTRACE: full
          ZURI_JIT_BAYELSA: "0"
        run: |
          set -o pipefail
          cargo test --locked --test zuri 2>&1 | tee -a test-output.txt

      # The whole log, kept as a file. A run with several failing
      # fixtures produces more output than the web view will show, and
      # the part that gets dropped is the middle, where each failure
      # explains itself. The artifact has all of it.
      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: test-output.txt
          retention-days: 7

      # A fixture killed by a signal produces no Rust backtrace and no
      # Zuri stack trace, so an exit status is the whole of what a
      # failing run says about it. macOS writes a real report for the
      # process that died, naming the faulting thread and its stack;
      # that report lives on a runner that is destroyed the moment this
      # job ends, so it has to be read out here or not at all.
      - name: Crash reports
        if: failure() && runner.os == 'macOS'
        run: |
          shopt -s nullglob
          reports=(~/Library/Logs/DiagnosticReports/*.ips)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "no crash reports were written"
            exit 0
          fi
          for report in "${reports[@]}"; do
            echo "===== $report"
            cat "$report"
          done

  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all --check

  documentation:
    name: documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: docs

      # The reference's pages are generated rather than committed, so
      # they have to exist before anything can be checked against them.
      # This needs no mdBook: it writes markdown and stops.
      # The patched crates are built from vendor/patches rather than
      # committed, and the workspace does not load without them.
      - name: Patch crates
        run: cargo patch-crates

      - name: Build and generate the reference
        run: |
          cargo build --locked
          cargo docs generate

      # A defect in a doc block in `libs/` becomes a defect in both
      # books, so the blocks are checked at their source.
      - name: Audit the library's doc blocks
        run: ./target/debug/zuri run docs/tools/audit.zu
        env:
          ZURI_ROOT: ${{ github.workspace }}

      - name: Check every link and anchor
        run: ./target/debug/zuri run docs/tools/links.zu
        env:
          ZURI_ROOT: ${{ github.workspace }}

  examples:
    name: examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: docs

      # The patched crates are built from vendor/patches rather than
      # committed, and the workspace does not load without them.
      - name: Patch crates
        run: cargo patch-crates

      - name: Build and generate the reference
        run: |
          cargo build --locked
          cargo docs generate

      # Every runnable example in both books is run and its output
      # compared against what the page claims it prints. This is the
      # slow one, which is why it is its own job.
      - name: Run every example
        run: ./target/debug/zuri run docs/tools/verify.zu
        env:
          ZURI_ROOT: ${{ github.workspace }}
