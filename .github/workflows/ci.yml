name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Cancel a run that a newer push has already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The Alpine the musl suite runs on, the one release.yml builds on.
  ALPINE: alpine:3.22

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # The patched crates are built from vendor/patches rather than
      # committed, and the workspace does not load without them.
      - name: Patch crates
        run: cargo patch-crates

      - name: Build
        run: cargo build --locked

      # The conformance suite. `build.rs` copies `libs/` next to the
      # binary, so the standard library is found without any env set.
      #
      # The backtrace is set through `env:` rather than as a
      # `VAR=value` prefix on the command: Windows runners use
      # PowerShell, which reads that prefix as the name of a command to
      # run and fails before cargo is ever reached. `env:` is applied
      # by the runner itself, so it works the same on every runner.
      # Run through bash on every runner, Windows included, so the
      # pipeline below behaves the same way everywhere: PowerShell's
      # own pipeline would report tee's exit status rather than
      # cargo's, and a failing suite would read as a passing step.
      - name: Test
        shell: bash
        env:
          RUST_BACKTRACE: full
        run: |
          set -o pipefail
          cargo test --locked --test zuri 2>&1 | tee test-output.txt

      # The same suite with Kebbi alone, the mode `ZURI_JIT_BAYELSA=0`
      # selects. The default run above covers both compilers together.
      - name: Test with Kebbi alone
        shell: bash
        env:
          RUST_BACKTRACE: full
          ZURI_JIT_BAYELSA: "0"
        run: |
          set -o pipefail
          cargo test --locked --test zuri 2>&1 | tee -a test-output.txt

      # The whole log, kept as a file. A run with several failing
      # fixtures produces more output than the web view will show, and
      # the part that gets dropped is the middle, where each failure
      # explains itself. The artifact has all of it. A cancelled run
      # keeps it too, since a run is usually cancelled because
      # something in it stopped moving.
      - name: Upload the test log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: test-output.txt
          retention-days: 7

      # A fixture killed by a signal produces no Rust backtrace and no
      # Zuri stack trace, so an exit status is the whole of what a
      # failing run says about it. macOS writes a real report for the
      # process that died, naming the faulting thread and its stack;
      # that report lives on a runner that is destroyed the moment this
      # job ends, so it has to be read out here or not at all.
      - name: Crash reports
        if: failure() && runner.os == 'macOS'
        run: |
          shopt -s nullglob
          reports=(~/Library/Logs/DiagnosticReports/*.ips)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "no crash reports were written"
            exit 0
          fi
          for report in "${reports[@]}"; do
            echo "===== $report"
            cat "$report"
          done

  # The same suite on musl, built and run on Alpine. GitHub's own actions
  # do not run inside Alpine on ARM, so the runner checks the code out and
  # every other step runs in one Alpine container kept up for the job.
  test-alpine:
    name: test (alpine, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      # The suite sets TZ to named zones, which musl reads from tzdata.
      # The checkout belongs to the runner's user rather than to root in
      # the container, which git refuses unless told it is safe.
      - name: Start Alpine
        run: |
          docker run -d --name alpine -v "${PWD}:/work" -w /work \
            -e PATH=/root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e CARGO_TERM_COLOR -e RUST_BACKTRACE=full \
            "${ALPINE}" sleep infinity
          docker exec alpine apk add --no-cache build-base curl git linux-headers tzdata
          docker exec alpine git config --global --add safe.directory /work
          docker exec alpine sh -c \
            'curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable'

      - name: Patch crates
        run: docker exec alpine cargo patch-crates

      - name: Build
        run: docker exec alpine cargo build --locked

      # The build container has libgcc, so it would never notice the
      # runtime needing it. A bare Alpine has only musl.
      - name: Run on a bare Alpine
        run: docker run --rm -v "${PWD}:/work:ro" "${ALPINE}" /work/target/debug/zuri --version

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          docker exec alpine cargo test --locked --test zuri 2>&1 | tee test-output.txt

      - name: Test with Kebbi alone
        shell: bash
        run: |
          set -o pipefail
          docker exec -e ZURI_JIT_BAYELSA=0 alpine cargo test --locked --test zuri 2>&1 |
            tee -a test-output.txt

      - name: Upload the test log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-alpine-${{ matrix.os }}
          path: test-output.txt
          retention-days: 7

  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all --check

  documentation:
    name: documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: docs

      # The patched crates are built from vendor/patches rather than
      # committed, and the workspace does not load without them.
      - name: Patch crates
        run: cargo patch-crates

      - name: Build
        run: cargo build --locked

      # Building checks every link inside each against the pages it
      # actually wrote, and --strict fails on one that leads nowhere. The
      # reference's pages are generated from `libs/` as it is built, and
      # --strict also fails on a module none of its groups lists. The
      # cache keeps what is left of the last build's sites after pruning
      # `target/`, which zuri doc will not build over, so they go first.
      - name: Build the book and the reference
        run: |
          rm -rf target/book target/reference
          ./target/debug/zuri doc build docs/book --strict
          ./target/debug/zuri doc build docs/reference --strict
        env:
          ZURI_ROOT: ${{ github.workspace }}

      # A defect in a doc block in `libs/` becomes a defect in the book
      # and the reference, so the blocks are checked at their source.
      - name: Audit the library's doc blocks
        run: ./target/debug/zuri run docs/tools/audit.zu
        env:
          ZURI_ROOT: ${{ github.workspace }}

  examples:
    name: examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: docs

      # The patched crates are built from vendor/patches rather than
      # committed, and the workspace does not load without them.
      - name: Patch crates
        run: cargo patch-crates

      - name: Build
        run: cargo build --locked

      # The reference's pages are generated rather than committed, and
      # its examples are run along with the book's.
      - name: Generate the reference
        run: |
          rm -rf target/reference
          ./target/debug/zuri doc generate docs/reference
        env:
          ZURI_ROOT: ${{ github.workspace }}

      # Every runnable example in the book and the reference is run and
      # its output compared against what the page claims it prints. This
      # is the slow one, which is why it is its own job.
      - name: Run every example
        run: ./target/debug/zuri run docs/tools/verify.zu
        env:
          ZURI_ROOT: ${{ github.workspace }}
