name: Documentation

# Two ways in, and neither is a push: publishing the site is a decision,
# not a side effect of merging.
#
#   workflow_dispatch  by hand, from the Actions tab
#   workflow_call      by the release workflow, once a release is out
#
# Called from a tag, `actions/checkout` takes the caller's ref, so the
# site published alongside a release is built from the code released.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag when called from release workflow'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: docs

      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      # The patched crates are built from vendor/patches rather than
      # committed, and the workspace does not load without them.
      - name: Patch crates
        run: cargo patch-crates

      # When called from the release workflow, update book chapters and
      # Cargo manifest to reflect the release version rather than the repo default.
      - name: Update version for release
        if: inputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ inputs.tag || github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"

          python3 - "$version" <<'PY'
          import sys
          import re

          version = sys.argv[1]
          pattern = re.compile(
              r'(?i)\b(zuri(?:vm)?)\s+(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)'
          )

          chapters = [
              "docs/book/src/ch01-01-installation.md",
              "docs/book/src/ch01-02-hello-world.md",
              "docs/book/src/ch01-03-the-repl.md",
          ]

          for path in chapters:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              updated = pattern.sub(rf'\g<1> {version}', content)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(updated)

          with open("Cargo.toml", "r", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(
              r'^(version\s*=\s*)"[^"]+"',
              f'\\g<1>"{version}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )
          content = re.sub(
              r'(\[package\.metadata\.zuri\][^\[]*?version\s*=\s*)"[^"]+"',
              f'\\g<1>"{version}"',
              content,
              count=1,
          )
          content = re.sub(
              r'(\[package\.metadata\.zuri\][^\[]*?vm_version\s*=\s*)"[^"]+"',
              f'\\g<1>"{version}"',
              content,
              count=1,
          )

          with open("Cargo.toml", "w", encoding="utf-8") as f:
              f.write(content)

          try:
              with open("Cargo.lock", "r", encoding="utf-8") as f:
                  lock = f.read()
              lock = re.sub(
                  r'(\[\[package\]\]\s+name\s*=\s*"zuri"\s+version\s*=\s*)"[^"]+"',
                  f'\\g<1>"{version}"',
                  lock,
                  count=1,
              )
              with open("Cargo.lock", "w", encoding="utf-8") as f:
                  f.write(lock)
          except FileNotFoundError:
              pass
          PY

      # The `zuri` binary has to exist before the docs tool runs: the
      # reference's pages are written by a Zuri program, and the tool
      # invokes the interpreter sitting beside it.
      - name: Build the interpreter
        run: cargo build --locked

      # One command does the lot: it writes the reference's pages from
      # the doc blocks in `libs/`, copies the shared theme into each
      # book, renders both with mdBook, and lays the finished website
      # out under `target/site` with the landing page from `docs/site`
      # over the top.
      - name: Build the site
        run: cargo build-docs

      # Only what the build assembled is published, and only rendered
      # HTML ever reaches it: the reference's markdown stays behind in
      # `target/reference/src`.
      - name: Check the site
        run: |
          set -euo pipefail

          test -f target/site/index.html
          test -f target/site/install.sh
          test -f target/site/install.ps1
          test -f target/site/book/index.html
          test -f target/site/reference/index.html

          if find target/site -name '*.md' | grep -q .; then
            echo "markdown reached the site; only rendered HTML should" >&2
            exit 1
          fi

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site
          # The site is fully regenerated each time, so the branch holds
          # the current render rather than an accumulation of old ones.
          force_orphan: true
          commit_message: 'docs: publish ${{ github.sha }}'
