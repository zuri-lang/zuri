[package]
name = "zuri"
version = "0.1.0"
edition = "2024"

# Repository chores that are not a build, kept out of the runtime crate
# so that running one does not compile or relink it. `cargo sync` is the
# one that exists.
[workspace]
members = ["xtask"]

[dependencies]
itertools = "0.15.0"
libc = "0.2.189"
nu-ansi-term = "0.50.3"
num-bigint = "0.5.1"
num-traits = "0.2.19"
reedline = "0.49.0"
rustc-hash = "2.1.3"
caseless = "0.2"
toml = "1.1.2"
pcre2 = "0.2.11"
smallvec = "1.15.2"
# no_thp stops mimalloc asking the kernel for transparent huge pages. They
# round every sparsely used region up to 2 MB, and this leaves the process's
# THP setting alone, so programs Zuri spawns keep the system's own policy.
mimalloc = { version = "0.1.52", default-features = false, features = ["no_thp"] }
minus = { version = "5.7.2", features = ["static_output"] }

# --- JIT -------------------------------------------------------------------

cranelift-jit = "0.134"
cranelift-codegen = "0.134"
cranelift-frontend = "0.134"
cranelift-module = "0.134"
cranelift-native = "0.134"
target-lexicon = "0.13"

# --- hash module (src/modules/hash.rs) -------------------------------------

digest = "0.10"
md-5 = "0.10"
md4 = "0.10"
md2 = "0.10"
sha1 = "0.10"
# "oid" carries the object identifiers the PKCS#1 v1.5 signature
# scheme prefixes a digest with; without it rsa's pkcs1v15 keys cannot
# be built over these hashes at all.
sha2 = { version = "0.10", features = ["oid"] }
sha3 = "0.10"
ripemd = "0.1"
blake2 = "0.10"
whirlpool = "0.10"
gost94 = "0.10"
sm3 = "0.4"

# --- crypto module (src/modules/crypto.rs) ---------------------------------

rand = "0.8"
rand_core = "0.6"
base64 = "0.22"
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
chacha20poly1305 = "0.10"
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
p384 = { version = "0.13", features = ["ecdsa", "pem"] }
ecdsa = { version = "0.16", features = ["pem"] }
signature = "2"
ed25519-dalek = { version = "2", features = [
    # "std",
    "pkcs8",
    "pem",
    "rand_core",
] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
argon2 = "0.5"
# Backs libs/bcrypt.zu specifically (a separate top-level module from
# crypto.zu), registered in this same _crypto native module right
# alongside argon2 since both are password-hashing primitives. Pure
# Rust, no C toolchain dependency, same story as argon2 above.
bcrypt = "0.19"

# --- compress module (src/modules/compress.rs) ---------------------------------

zlib-rs = "0.6.7"
zrip = "0.8.5"
lz4_flex = "0.14.0"
# bzip2 defaults to the libbz2-rs-sys backend (a pure-Rust bzip2
# reimplementation), same story as zlib-rs above — no C toolchain
# dependency.
bzip2 = "0.6.1"
# brotli is pure Rust top to bottom, no backend choice needed.
brotli = "8.0.4"

# --- net::tls / net::dtls (src/modules/net_tls.rs, src/modules/net_dtls.rs) ----

# rustls picks aws-lc-rs as its crypto provider by default (the "aws_lc_rs"
# feature below); rtc-dtls is told to use the same provider via its own
# "aws-lc-rs" feature so we only ever link one crypto backend, not two.
rustls = { version = "0.23", features = ["aws_lc_rs", "log"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-pemfile = "2"
webpki-roots = "1"
rustls-native-certs = "0.8"
x509-cert = { version = "0.3", features = ["std", "pem"] }
rtc-dtls = { version = "0.20", default-features = false, features = [
    "aws-lc-rs",
    "pem",
] }
# rtc-shared is a transitive dependency of rtc-dtls already, but rtc-dtls's
# public API (Endpoint::connect/read/write) returns its Result/Error type
# directly, so it needs to be named here too rather than just along for
# the ride.
rtc-shared = "0.20"
bytes = "1"
# rcgen bridges a parsed PKCS#8 private key into rtc-dtls's own
# CryptoPrivateKey type; rtc-dtls's Certificate::from_pem() turned out to
# reject standard "-----BEGIN PRIVATE KEY-----" PEM (it checks the PEM tag
# against the literal "PRIVATE_KEY", which no real key ever has), so
# certificates are built through rcgen::KeyPair directly instead. Matched
# to aws_lc_rs so it isn't pulling in ring on top of everything else.
rcgen = { version = "0.14", default-features = false, features = [
    "aws_lc_rs",
    "pem",
] }

# --- imagine module (src/modules/imagine.rs) -------------------------------

# Codecs, resampling and the per-pixel kernels. Pure Rust across every
# format we enable, so there's still no C toolchain in the build; the
# one format that would need one is AVIF *decoding* (libdav1d), which is
# why "avif-native" is deliberately absent and AVIF is encode-only.
# rayon is on because ravif's AV1 encoder is painfully slow without it.
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "tiff",
    "tga",
    "webp",
    "avif",
    "qoi",
    "ico",
    "pnm",
    "rayon",
] }
# Glyph rasterization for imagine's text drawing. no_std, no C, and it
# hands back a plain coverage bitmap, which is exactly the shape the Zuri
# side wants for compositing.
fontdue = "0.9"
# Palette reduction behind Image.quantize(); the same crate image's own
# GIF encoder already pulls in, so this is naming an existing dependency
# rather than adding one.
color_quant = "1.1"

# --- date (src/modules/date.rs) --------------------------------------------

chrono = "0.4.45"
chrono-tz = "0.10.4"

# sql.sqlite (src/modules/sqlite.rs, src/modules/sqlite_util/)
#
# The raw C API rather than a safe wrapper on top of it. A Zuri cursor
# holds a live sqlite3_stmt across separate calls from the VM and steps
# it one row at a time, which a borrow-checked Statement<'conn> cannot
# express without self-referential contortions; raw handles behind
# Obj::Ptr are the shape the rest of this codebase already uses for
# external resources.
#
# "bundled" compiles SQLite's own amalgamation, so there is no system
# sqlite to find and no version skew between platforms. That does want a
# C compiler, which aws-lc-sys (via rustls) already requires, so it adds
# nothing to what a build of this crate needed anyway. "column_metadata"
# turns on SQLITE_ENABLE_COLUMN_METADATA, without which a result column
# cannot report the table it actually came from.
libsqlite3-sys = { version = "0.38.2", features = [
    "bundled",
    "column_metadata",
] }

# --- ffi (src/modules/ffi.rs, src/modules/ffi_util/) ----------------------

# libffi is what actually makes a call through a signature only known at
# run time, and what builds the closures a C library calls back into.
# The raw bindings rather than the `libffi` crate's safe layer: every
# type the module describes is laid out by its own code, and the safe
# layer's owned `Type` values cannot express a struct whose size and
# alignment are fixed ahead of time. The default build compiles the
# bundled libffi sources, so no system copy is looked for. Complex
# types exist only where the C compiler has them, which rules out MSVC.
libffi-sys = "4.2.2"

# --- io::TTY.getsize (src/modules/io.rs) -----------------------------------

# The rest of io::TTY (raw mode, tcgetattr/tcsetattr) is genuinely termios-
# only and has no Windows equivalent, but console size IS available there
# via the Win32 console API, so that one function gets its own real
# implementation instead of the same "not supported" stub as the others.
#
# The os module (src/modules/os.rs, src/modules/os_util/) adds three
# more features on top: SystemInformation for GlobalMemoryStatusEx/
# GetTickCount64/hostname (os.total_memory/free_memory/uptime/hostname),
# ToolHelp for the process-snapshot walk os.ppid() needs (Windows has
# no direct getppid syscall), and Threading for OpenProcess/
# TerminateProcess behind os.kill()/Process.kill().
[target.'cfg(not(windows))'.dependencies]
libffi-sys = { version = "4.2.2", features = ["complex"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    # WSAPoll and its flags, for `net.poll` on Windows. Every module in
    # this crate is behind its own feature; without this one the whole
    # of Win32::Networking is compiled out.
    "Win32_Networking_WinSock",
    # GetAdaptersAddresses, for the nameserver list behind net.resolver.
    # Ndis comes with it rather than on its own merit: the adapter
    # struct names IF_OPER_STATUS and a couple of other Ndis types in
    # its own fields, so without it the struct does not exist.
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    # LoadLibraryExW, GetProcAddress and friends, for `ffi.open()`, plus
    # the module walk that stands in for dlsym(RTLD_DEFAULT) when a
    # symbol is looked up in the process as a whole. SearchPathW is how
    # `ffi.find()` answers without loading anything.
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_Debug",
    "Win32_Storage_FileSystem",
    # QueryInformationJobObject, so the collector sizes its young
    # generation against a job's memory limit rather than the machine's.
    "Win32_System_JobObjects",
] }
# Locates MSVC's link.exe, and the environment it needs, for turning a
# static library into a DLL in `ffi.link()`. The same crate `cc` uses to
# find the compiler, and already in the build through it.
find-msvc-tools = "0.1.9"


# Builds the C library the ffi suites call into, with the same compiler
# discovery the build uses for its own C dependencies.
[dev-dependencies]
cc = "1.2.67"

# The test harness reads each fixture's resident memory to hold it to a
# cap; on Windows that is GetProcessMemoryInfo.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
] }

[build-dependencies]
chrono = "0.4.45"
toml = "1.1.2"

[package.metadata.zuri]
version = "0.1.0"
vm_version = "0.1.0"
history_size = 1000

[profile.release]
opt-level = 3
debug = true
# lto = true
lto = "thin"
codegen-units = 1
# Was "abort" purely to shave a little startup/runtime overhead off
# the single-threaded interpreter. Now that isolate pool threads
# exist, unwinding is required: it's the only way a bug in one
# isolate's own execution path can be caught and turned into an
# IsolateError instead of aborting the entire process out from
# under every other isolate and the main thread. Default (unwind).
# panic = "abort"

# Big-integer RSA key generation and the password hashes, which are
# slow on purpose, are unusably slow at debug opt-level. Bumping just
# these packages keeps the zuri crate itself on fast normal debug builds.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blowfish]
opt-level = 3

[features]
opcode-profile = []
ast-log = []
# Only needed to build/serve the book. Off by default so an ordinary
# build (and `cargo install --path .`) carries just the `zuri` binary.
docs-tool = []

[lib]
doctest = false

# Gated behind `docs-tool` so it never rides along with the language
# binary. The cargo aliases in `.cargo/config.toml` turn the feature on
# for you; see docs/README.md.
[[bin]]
name = "docs"
path = "src/bin/docs.rs"
required-features = ["docs-tool"]

# Cranelift's x64 backend with jumps placed clear of 32-byte boundaries on
# cores with Intel's jump erratum. The copy is built from
# vendor/patches by `cargo patch-crates`; see vendor/README.md.
[patch.crates-io]
cranelift-codegen = { path = "vendor/crates/cranelift-codegen" }
