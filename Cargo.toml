[package]
name = "zuri"
version = "0.1.0"
edition = "2024"

[dependencies]
itertools = "0.15.0"
libc = "0.2.189"
nu-ansi-term = "0.50.3"
num-bigint = "0.5.1"
num-traits = "0.2.19"
reedline = "0.49.0"
regex = "1.13.1"
rustc-hash = "2.1.3"
smallvec = "1.15.2"
mimalloc = { version = "0.1.52", default-features = false }

# --- hash module (src/modules/hash.rs) -------------------------------------
digest = "0.10"
md-5 = "0.10"
md4 = "0.10"
md2 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
blake2 = "0.10"
whirlpool = "0.10"
gost94 = "0.10"
sm3 = "0.4"

# --- crypto module (src/modules/crypto.rs) ---------------------------------
rand = "0.8"
rand_core = "0.6"
base64 = "0.22"
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
chacha20poly1305 = "0.10"
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
p384 = { version = "0.13", features = ["ecdsa", "pem"] }
ecdsa = { version = "0.16", features = ["pem"] }
signature = "2"
ed25519-dalek = { version = "2", features = [
    # "std",
    "pkcs8",
    "pem",
    "rand_core",
] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
argon2 = "0.5"

# --- compress module (src/modules/compress.rs) ---------------------------------
zlib-rs = "0.6.7"
zrip = "0.8.5"
lz4_flex = "0.14.0"
cranelift-jit = "0.134"
cranelift-codegen = "0.134"
cranelift-frontend = "0.134"
cranelift-module = "0.134"
cranelift-native = "0.134"
target-lexicon = "0.13"


[build-dependencies]
chrono = "0.4.45"
copy_to_output = "2.2.0"
toml = "1.1.2"

[package.metadata.zuri]
version = "0.1.0"
vm_version = "0.1.0"
history_size = 1000

[profile.release]
opt-level = 3
debug = true
# lto = true
lto = "thin"
codegen-units = 1
# Was "abort" purely to shave a little startup/runtime overhead off
# the single-threaded interpreter. Now that coroutine worker threads
# exist, unwinding is required: it's the only way a bug in one
# coroutine's own execution path can be caught and turned into a
# CoroutineError instead of aborting the entire process out from
# under every other coroutine and the main thread. Default (unwind).
# panic = "abort"

[features]
opcode-profile = []
ast-log = []

[lib]
doctest = false
