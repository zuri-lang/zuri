[package]
name = "zuri"
version = "0.1.0"
edition = "2024"

[dependencies]
itertools = "0.15.0"
libc = "0.2.189"
nu-ansi-term = "0.50.3"
num-bigint = "0.5.1"
num-traits = "0.2.19"
reedline = "0.49.0"
regex = "1.13.1"
rustc-hash = "2.1.3"

# --- hash module (src/modules/hash.rs) -------------------------------------
digest = "0.11.3"
md-5 = "0.11"
md4 = "0.11"
md2 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
ripemd = "0.2"
blake2 = "0.10"
whirlpool = "0.10"
gost94 = "0.11"
sm3 = "0.5"

# --- crypto module (src/modules/crypto.rs) ---------------------------------
rand = "0.10.2"
rand_core = "0.10.1"
base64 = "0.23"
aes = "0.9.2"
aes-gcm = "0.11"
cbc = "0.2.1"
chacha20poly1305 = "0.10"
rsa = "0.9"
p256 = { version = "0.14", features = ["ecdsa", "pem"] }
p384 = { version = "0.14", features = ["ecdsa", "pem"] }
ecdsa = { version = "0.17", features = ["pem"] }
signature = "2"
ed25519-dalek = { version = "3", features = [
    "std",
    "pkcs8",
    "pem",
    "rand_core",
] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
hkdf = "0.13"
argon2 = "0.5"

[build-dependencies]
chrono = "0.4.45"
copy_to_output = "2.2.0"
toml = "1.1.2"

[package.metadata.zuri]
version = "0.1.0"
vm_version = "0.1.0"
history_size = 1000

[profile.release]
debug = true
lto = true
codegen-units = 1
panic = "abort"

[features]
opcode-profile = []
gc-log = []
instr-log = []
ast-log = []
