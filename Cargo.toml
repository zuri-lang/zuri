[package]
name = "zuri"
version = "0.1.0"
edition = "2024"

[dependencies]
itertools = "0.15.0"
libc = "0.2.189"
nu-ansi-term = "0.50.3"
num-bigint = "0.5.1"
num-traits = "0.2.19"
reedline = "0.49.0"
rustc-hash = "2.1.3"
caseless = "0.2"
pcre2 = "0.2.11"
smallvec = "1.15.2"
mimalloc = { version = "0.1.52", default-features = false }
minus = { version = "5.7.2", features = ["static_output"] }

# --- JIT -------------------------------------------------------------------

cranelift-jit = "0.134"
cranelift-codegen = "0.134"
cranelift-frontend = "0.134"
cranelift-module = "0.134"
cranelift-native = "0.134"
target-lexicon = "0.13"

# --- hash module (src/modules/hash.rs) -------------------------------------

digest = "0.10"
md-5 = "0.10"
md4 = "0.10"
md2 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
blake2 = "0.10"
whirlpool = "0.10"
gost94 = "0.10"
sm3 = "0.4"

# --- crypto module (src/modules/crypto.rs) ---------------------------------

rand = "0.8"
rand_core = "0.6"
base64 = "0.22"
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
chacha20poly1305 = "0.10"
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
p384 = { version = "0.13", features = ["ecdsa", "pem"] }
ecdsa = { version = "0.16", features = ["pem"] }
signature = "2"
ed25519-dalek = { version = "2", features = [
    # "std",
    "pkcs8",
    "pem",
    "rand_core",
] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
argon2 = "0.5"

# --- compress module (src/modules/compress.rs) ---------------------------------

zlib-rs = "0.6.7"
zrip = "0.8.5"
lz4_flex = "0.14.0"
# bzip2 defaults to the libbz2-rs-sys backend (a pure-Rust bzip2
# reimplementation), same story as zlib-rs above — no C toolchain
# dependency.
bzip2 = "0.6.1"
# brotli is pure Rust top to bottom, no backend choice needed.
brotli = "8.0.4"

# --- net::tls / net::dtls (src/modules/net_tls.rs, src/modules/net_dtls.rs) ----

# rustls picks aws-lc-rs as its crypto provider by default (the "aws_lc_rs"
# feature below); rtc-dtls is told to use the same provider via its own
# "aws-lc-rs" feature so we only ever link one crypto backend, not two.
rustls = { version = "0.23", features = ["aws_lc_rs", "log"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-pemfile = "2"
webpki-roots = "1"
rustls-native-certs = "0.8"
x509-cert = { version = "0.3", features = ["std", "pem"] }
rtc-dtls = { version = "0.20", default-features = false, features = [
    "aws-lc-rs",
    "pem",
] }
# rtc-shared is a transitive dependency of rtc-dtls already, but rtc-dtls's
# public API (Endpoint::connect/read/write) returns its Result/Error type
# directly, so it needs to be named here too rather than just along for
# the ride.
rtc-shared = "0.20"
bytes = "1"
# rcgen bridges a parsed PKCS#8 private key into rtc-dtls's own
# CryptoPrivateKey type; rtc-dtls's Certificate::from_pem() turned out to
# reject standard "-----BEGIN PRIVATE KEY-----" PEM (it checks the PEM tag
# against the literal "PRIVATE_KEY", which no real key ever has), so
# certificates are built through rcgen::KeyPair directly instead. Matched
# to aws_lc_rs so it isn't pulling in ring on top of everything else.
rcgen = { version = "0.14", default-features = false, features = [
    "aws_lc_rs",
    "pem",
] }

# --- io::TTY.getsize (src/modules/io.rs) -----------------------------------

# The rest of io::TTY (raw mode, tcgetattr/tcsetattr) is genuinely termios-
# only and has no Windows equivalent, but console size IS available there
# via the Win32 console API, so that one function gets its own real
# implementation instead of the same "not supported" stub as the others.
#
# The os module (src/modules/os.rs, src/modules/os_util/) adds three
# more features on top: SystemInformation for GlobalMemoryStatusEx/
# GetTickCount64/hostname (os.total_memory/free_memory/uptime/hostname),
# ToolHelp for the process-snapshot walk os.ppid() needs (Windows has
# no direct getppid syscall), and Threading for OpenProcess/
# TerminateProcess behind os.kill()/Process.kill().
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }


[build-dependencies]
chrono = "0.4.45"
copy_to_output = "2.2.0"
toml = "1.1.2"

[package.metadata.zuri]
version = "0.1.0"
vm_version = "0.1.0"
history_size = 1000

[profile.release]
opt-level = 3
debug = true
# lto = true
lto = "thin"
codegen-units = 1
# Was "abort" purely to shave a little startup/runtime overhead off
# the single-threaded interpreter. Now that isolate pool threads
# exist, unwinding is required: it's the only way a bug in one
# isolate's own execution path can be caught and turned into an
# IsolateError instead of aborting the entire process out from
# under every other isolate and the main thread. Default (unwind).
# panic = "abort"

# Big-integer RSA key generation is unusably slow at debug opt-level.
# Bumping just these two packages keeps the zuri crate itself on fast
# normal debug builds.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

[features]
opcode-profile = []
ast-log = []

[lib]
doctest = false
