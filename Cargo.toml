[package]
name = "zuri"
version = "0.1.0"
edition = "2024"

[dependencies]
itertools = "0.15.0"
libc = "0.2.189"
nu-ansi-term = "0.50.3"
num-bigint = "0.5.1"
num-traits = "0.2.19"
reedline = "0.49.0"
regex = "1.13.1"
rustc-hash = "2.1.3"

[build-dependencies]
chrono = "0.4.45"
copy_to_output = "2.2.0"
toml = "1.1.2"

[package.metadata.zuri]
version = "0.1.0"
vm_version = "0.1.0"
history_size = 1000

[profile.release]
debug = true
lto = true
codegen-units = 1
panic = "abort"

[features]
opcode-profile = []
gc-log = []
instr-log = []
ast-log = []
