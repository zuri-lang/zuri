<extend base="layout.html">
  <define name="content">
    <form class="panel" method="post" action="/signup">
      <h1>Create an account</h1>
      <p>An account is what you publish packages with. Installing needs none.</p>
      <p class="error" x-if="error">{{ error }}</p>
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <label>Username <input name="username" value="{{ username }}" autocomplete="username" required pattern="[a-z][a-z0-9_\-]{1,38}[a-z0-9]"></label>
      <p class="hint">3 to 40 lowercase letters, digits, hyphens and underscores.</p>
      <label>Email <input name="email" type="email" value="{{ email }}" autocomplete="email" required></label>
      <label>Password <input name="password" type="password" autocomplete="new-password" required minlength="10"></label>
      <label>Password again <input name="password_again" type="password" autocomplete="new-password" required minlength="10"></label>
      <button>Create account</button>
    </form>
  </define>
</extend>
