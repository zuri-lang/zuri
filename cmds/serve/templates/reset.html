<extend base="layout.html">
  <define name="content">
    <form class="panel" method="post" action="/reset/{{ code }}">
      <h1>Choose a new password</h1>
      <p class="error" x-if="error">{{ error }}</p>
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <label>New password <input name="password" type="password" autocomplete="new-password" required minlength="10"></label>
      <label>New password again <input name="password_again" type="password" autocomplete="new-password" required minlength="10"></label>
      <button>Set the password</button>
    </form>
  </define>
</extend>
